# New isolated stack only. See docs/RK-GAMING-MANAGER.md before use.
# Supply an image built from the reviewed RK branch; no RK image is published yet.
name: rk-gaming-manager

services:
  db:
    image: docker.io/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rk
      POSTGRES_DB: rk
      POSTGRES_PASSWORD: ${RK_DB_PASSWORD:?Set RK_DB_PASSWORD}
    volumes:
      - rk_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rk -d rk"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${RK_IMAGE:?Set RK_IMAGE to your reviewed RK image tag or digest}
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${RK_BIND_ADDRESS:-127.0.0.1}:${RK_PORT:-8010}:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: rk
      DB_NAME: rk
      DB_PASSWORD: ${RK_DB_PASSWORD:?Set RK_DB_PASSWORD}
      DB_ENCRYPTION_KEY: ${RK_DB_ENCRYPTION_KEY:?Set RK_DB_ENCRYPTION_KEY}
      SESSION_COOKIE_SECURE: "true"
      IGDB_CLIENT_ID: ${RK_IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${RK_IGDB_CLIENT_SECRET:-}
      STORAGE_PATH: /app/storage
      BACKUP_PATH: /app/storage/backups
      LEGENDARY_WORK_DIR: /var/lib/legendary
    volumes:
      - rk_storage:/app/storage
      - type: tmpfs
        target: /var/lib/legendary
        tmpfs:
          mode: 0777

volumes:
  rk_postgres:
  rk_storage:
